<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LocalTube</title>
    <script>
      // Apply the saved palette and light/dark mode before first paint (see src/lib/theme.ts).
      ;(() => {
        const get = (k, d) => {
          try {
            const v = localStorage.getItem('localtube:' + k)
            return v === null ? d : JSON.parse(v)
          } catch {
            return d
          }
        }
        const mode = get('mode', 'system')
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = get('theme', 'bubblegum')
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
