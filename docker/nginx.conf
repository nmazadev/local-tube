# Serves the React build and downloaded videos from disk; proxies /api to uvicorn.
# Runs as a non-root user: no `user` directive, pid and temp files in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream api {
        server 127.0.0.1:8000;
        keepalive 8;
    }

    server {
        listen 8080;
        root /app/frontend;

        # Client-side routes (/watch?url=...) all load index.html.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }

        # Vite's hashed bundles never change.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Resolving a video can take several seconds.
            proxy_read_timeout 120s;
        }

        # Video/audio relayed from YouTube: pass bytes through as they arrive
        # (Range headers are forwarded as-is).
        location /api/stream/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # App state (.localtube: download queue, YouTube cookies) lives in the library
        # folder but is never served.
        location ~ ^/media/\. {
            return 404;
        }

        # Downloaded videos straight from disk, with native Range support.
        location /media/ {
            alias /library/;
            add_header Cache-Control "no-cache";
        }

        location = /healthz {
            proxy_pass http://api/api/health;
        }
    }
}
