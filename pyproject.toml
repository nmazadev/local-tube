[project]
name = "localtube"
version = "0.1.0"
description = "Ad-free local YouTube player built on yt-dlp"
authors = [
    { name = "Nicolas Maza", email = "nicolas.maza@nmaza.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "deno>=2.9.8",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
localtube = "localtube.__main__:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
